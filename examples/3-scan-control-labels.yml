          policy: skip
      - name: cloud.gardener.cnudie/dso/scanning-hints/source_analysis/v1
        value:
          policy: skip
      # - name: cloud.gardener.cnudie/responsibles
      #   value:
      #     - type: codeowners
    resources:
      - name: nginx
        type: ociImage
        version: 1.25.3
        relation: external
        access:
          type: ociArtifact/v1
          imageReference: docker.io/library/nginx:1.25.3
        labels:
          - name: gardener.cloud/cve-categorisation
            value:
              network_exposure: public
              authentication_enforced: false
              user_interaction: end-user
              confidentiality_requirement: low
              integrity_requirement: high
              availability_requirement: high
      - name: redis
        type: ociImage
        version: 7.2.3
        relation: external
        access:
          type: ociArtifact/v1
          imageReference: docker.io/library/redis:7.2.3
        labels:
          - name: gardener.cloud/cve-categorisation
            value:
              network_exposure: private
              authentication_enforced: true
              user_interaction: operator
              confidentiality_requirement: high
              integrity_requirement: high
              availability_requirement: high
    sources:
      - name: ocm-examples-source
        type: git
        version: 1.1.0
        access:
          type: gitHub/v1
          repoUrl: https://github.com/ChrisSchneider/ocm-examples
          commit: 5f99cc45a15e48b1f95c8b724bb7ddbaa76369fc

  # Same as scan-control-skip-some-resources but with legacy labels.
  - name: chrisschneider.dev/ocm-examples/scan-control-skip-some-resources-legacy
    version: 1.1.0
    provider:
      name: acme
    # labels:
    #   - name: cloud.gardener.cnudie/responsibles
    #     value:
    #       - type: codeowners
    resources:
      - name: alpine-scan-binary
        type: ociImage
