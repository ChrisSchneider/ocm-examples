    sources:
      - name: ocm-examples-source-skip
        type: git
        version: 1.1.0
        access:
          type: gitHub/v1
          repoUrl: https://github.com/ChrisSchneider/ocm-examples
          commit: 63adfec66f02e6b582f11932fe60f891145c4faf
        labels:
          - name: cloud.gardener.cnudie/dso/scanning-hints/source_analysis/v1
            value:
              policy: skip

  # Umbrella component referencing all scan-control examples.
  - name: chrisschneider.dev/ocm-examples/scan-control
    version: 1.1.0
    provider:
      name: acme
    componentReferences:
      - name: skip-component
        componentName: chrisschneider.dev/ocm-examples/scan-control-skip-component
        version: 1.1.0
      - name: skip-some-resources
        componentName: chrisschneider.dev/ocm-examples/scan-control-skip-some-resources
        version: 1.1.0
      - name: skip-component-legacy
        componentName: chrisschneider.dev/ocm-examples/scan-control-skip-component-legacy
        version: 1.1.0
      - name: skip-some-resources-legacy
        componentName: chrisschneider.dev/ocm-examples/scan-control-skip-some-resources-legacy
        version: 1.1.0
