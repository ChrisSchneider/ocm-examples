name: chrisschneider.dev/ocm-examples/known-vulnerabilities
version: 1.0.4
provider:
  name: acme

resources:
  # nginx 1.14.0 container image — CVE-2019-9511, CVE-2019-9513 + dozens of Debian base CVEs
  - name: nginx-oci
    type: ociImage
    version: 1.14.0
    relation: external
    access:
      type: ociArtifact/v1
      imageReference: docker.io/library/nginx:1.14.0
  # - name: nginx-local
  #   type: ociArtifact
  #   version: 1.14.0
  #   relation: local
  #   input:
  #     type: dir/v1
  #     path: blobs/nginx-oci-layout/
  #     mediaType: application/vnd.ocm.software.oci.layout.v1+tar

  # kubectl v1.20.0 — CVE-2021-25741 (symlink path traversal)
  - name: kubectl-wget
    type: executable
    version: 1.20.0
    relation: external
    extraIdentity:
      os: linux
      architecture: amd64
    access:
      type: wget/v1
      url: https://dl.k8s.io/release/v1.20.0/bin/linux/amd64/kubectl
      mediaType: application/octet-stream
  # - name: kubectl-s3
  #   type: executable
  #   version: 1.20.0
  #   relation: external
  #   extraIdentity:
  #     os: linux
  #     architecture: amd64
  #   access:
  #     type: s3/v2
  #     endpoint: http://registry.internal:10900
  #     bucket: ocm-examples
  #     key: kubectl-v1.20.0-linux-amd64
  #     region: garage
  # - name: kubectl-local
  #   type: executable
  #   version: 1.20.0
  #   relation: local
  #   extraIdentity:
  #     os: linux
  #     architecture: amd64
  #   input:
  #     type: File/v1
  #     path: blobs/kubectl-v1.20.0-linux-amd64
  #     mediaType: application/octet-stream

  # lodash 4.17.15 npm package — CVE-2021-23337 (command injection), CVE-2020-28500 (ReDoS)
  # - name: lodash
  #   type: npmPackage
  #   version: 4.17.15
  #   relation: external
  #   access:
  #     type: npm/v1
  #     package: lodash
  #     version: 4.17.15

  # directory tree containing log4j-core-2.14.1.jar — CVE-2021-44228 (Log4Shell)
  - name: vuln-dir-oras
    type: directoryTree
    version: 1.0.0
    relation: external
    access:
      type: ociArtifact/v1
      imageReference: ghcr.io/chrisschneider/ocm-examples/vuln-dir:1.0.0
  # - name: vuln-dir-s3
  #   type: directoryTree
  #   version: 1.0.0
  #   relation: external
  #   access:
  #     type: s3/v2
  #     endpoint: http://registry.internal:10900
  #     bucket: ocm-examples
  #     key: vuln-dir.tar.gz
  #     region: garage
  - name: vuln-dir-local
    type: blob
    version: 1.0.0
    relation: local
    input:
      type: Dir/v1
      path: blobs/vuln-dir/
      compress: true

  # CycloneDX SBOM listing log4j-core 2.14.1, lodash 4.17.15, express 4.17.1
  # CVE-2021-44228 (Log4Shell), CVE-2021-23337, CVE-2022-24999
  - name: sbom-oras
    type: sbom
    version: 1.0.0
    relation: external
    access:
      type: ociArtifact/v1
      imageReference: ghcr.io/chrisschneider/ocm-examples/sbom-oras:1.0.0
